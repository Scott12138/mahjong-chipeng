<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>局内页 · 优化后 1:1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,'PingFang SC','Hiragino Sans GB',sans-serif;background:#F7F5F0;
     color:#22201C;padding:36px 30px 56px;-webkit-font-smoothing:antialiased;}
h1{font-size:25px;font-weight:800;letter-spacing:1px;}
h1 small{font-size:13px;font-weight:400;color:#8E8571;margin-left:10px;letter-spacing:0;}
.lead{font-size:14px;color:#57503F;line-height:1.9;margin:12px 0 28px;max-width:1200px;}
.lead b{color:#C4362B;}
.row{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap;}
.col{display:flex;flex-direction:column;align-items:center;gap:12px;}
.cap{font-size:15px;font-weight:700;}
.cap em{font-style:normal;font-weight:400;color:#8E8571;font-size:13px;}
.frame{width:720px;height:1280px;position:relative;overflow:hidden;flex:none;
       box-shadow:0 16px 44px rgba(34,32,28,.22);border-radius:4px;transform-origin:top left;}
.scale-wrap{width:432px;height:768px;position:relative;}
.scale-wrap .frame{transform:scale(.6);}
.bgimg{position:absolute;inset:0;width:100%;height:100%;display:block;}

/* ---------- 控件：坐标一律「中心点 + 尺寸」 ---------- */
.abs{position:absolute;transform:translate(-50%,-50%);}

/* ---------- 顶部信息条：弹性三段（关卡名 —「规则」钮 — 计时） ----------
   ★ 为什么不能再走「绝对居中」。
     旧稿那颗圆「?」是 42×42、绝对居中于 x=360；换成汉字「规则」后，
     最窄也要 88 宽 —— 居中展开成 316~404，而关卡名（宋体 30 + 描边）
     右边界在 307，只剩 9px，必撞。
   ★ 现在的做法：整条 flex，两个 `margin-left:auto` 把余量**均分**给两处间隙。
     于是「关卡名右边界 → 规则钮」与「规则钮 → 计时左边界」永远相等，
     关卡名再长也只是把间隙压缩 —— **结构上不可能重叠或相撞**。
     本稿实算：标题 88~307、规则钮 377~469、计时 539~632，两侧各 70。 */
.hdr{position:absolute;display:flex;align-items:center;width:544px;height:46px;}
.hdr-title{font-family:'Songti SC','STSong','SimSun',serif;font-size:30px;font-weight:800;
  letter-spacing:1px;white-space:nowrap;color:#22201C;
  -webkit-text-stroke:3px #F0E4C8;paint-order:stroke fill;
  text-shadow:0 3px 0 #C9A227,0 6px 9px rgba(34,32,28,.26);}
.hdr-time{margin-left:auto;font-family:'Songti SC','STSong','SimSun',serif;font-size:30px;
  font-weight:800;letter-spacing:2px;white-space:nowrap;color:#C4362B;
  text-shadow:0 2px 0 rgba(255,255,255,.85),0 3px 6px rgba(196,54,43,.22);}
/* 「规则」按钮 —— 圆角方（与底部「重玩」同形制），不是圆钮：两个字塞不进圆。
   字号 28 比原「?」的 22 大一档；高 46 ＝ 顶部条高，上沿正好贴版心上限 522。 */
.rule-btn{margin-left:auto;flex:none;width:92px;height:46px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;line-height:1;
  font-family:'Songti SC','STSong','SimSun',serif;
  font-size:28px;font-weight:800;letter-spacing:2px;color:#2B2823;
  border:3px solid #22201C;
  background:linear-gradient(180deg,#FFFDF7 0%,#F2EBD9 60%,#E4DAC2 100%);
  box-shadow:0 4px 0 #C3B89F,0 4px 0 3px #22201C,0 9px 12px rgba(34,32,28,.24);
  text-shadow:0 1px 0 rgba(255,255,255,.9);}
.hair{position:absolute;height:2px;background:linear-gradient(90deg,
  rgba(34,32,28,0),rgba(34,32,28,.42) 12%,rgba(34,32,28,.42) 88%,rgba(34,32,28,0));}

/* 进度条 */
.bar{position:absolute;border-radius:99px;border:2.5px solid #22201C;
  background:linear-gradient(180deg,#DFD5BE,#F2EADA);
  box-shadow:inset 0 3px 5px rgba(34,32,28,.20),0 3px 0 #C9BFA8;}
.bar i{position:absolute;left:2.5px;top:50%;transform:translateY(-50%);height:52%;
  background:linear-gradient(180deg,#E85A4F,#C4362B);border-radius:99px;}
.bar b{position:absolute;top:50%;transform:translateY(-50%);width:3px;height:190%;
  background:#B9B09A;border-radius:2px;margin-left:-1.5px;}

/* 计数 / 提示 */
.cnt{font-size:18px;font-weight:700;color:#4A4436;letter-spacing:.5px;white-space:nowrap;
  text-shadow:0 1px 0 rgba(255,255,255,.8);}
.tip{font-size:18px;color:#6B6455;letter-spacing:.2px;white-space:nowrap;}

/* 槽位条 */
.slotbar{border-radius:14px;border:3.5px solid #22201C;
  background:linear-gradient(180deg,#E7DCC4,#F4EDDC);
  box-shadow:inset 0 5px 9px rgba(34,32,28,.20),0 5px 0 #C3B89F,0 10px 14px rgba(34,32,28,.18);
  display:flex;align-items:center;justify-content:space-between;padding:7px;}
.slotbar s{text-decoration:none;height:100%;border-radius:8px;flex:1;margin-right:5px;
  background:linear-gradient(180deg,#DCD2BA,#EFE7D5);
  box-shadow:inset 0 3px 6px rgba(34,32,28,.20);}
.slotbar s:last-child{margin-right:0;}

/* 道具栏 */
.tools{display:flex;gap:8px;}
.tool{flex:1;border-radius:16px;border:3.5px solid #22201C;
  background:linear-gradient(180deg,#FFFDF7 0%,#F2EBD9 60%,#E4DAC2 100%);
  box-shadow:0 6px 0 #C3B89F,0 6px 0 3.5px #22201C,0 11px 15px rgba(34,32,28,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#2B2823;}
.tool b{font-size:24px;font-weight:800;letter-spacing:1px;text-shadow:0 1px 0 rgba(255,255,255,.9);}
.tool s{font-size:14px;text-decoration:none;color:#8E8571;letter-spacing:.5px;}
.tool.red{background:linear-gradient(180deg,#EA6055 0%,#D8433A 45%,#C4362B 100%);
  box-shadow:0 6px 0 #7E1D16,0 6px 0 3.5px #22201C,0 11px 15px rgba(34,32,28,.28);color:#fff;}
.tool.red b{text-shadow:0 2px 0 rgba(0,0,0,.30);}
.tool.red s{color:#F6D9D4;}

/* 按钮 */
.btn{border-radius:999px;border:4px solid #22201C;display:flex;align-items:center;
  justify-content:center;font-weight:800;overflow:hidden;}
.btn span{position:relative;z-index:2;}
.btn::before{content:'';position:absolute;left:5%;right:5%;top:8%;height:36%;z-index:1;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.60),rgba(255,255,255,0));}
.btn-back{background:linear-gradient(180deg,#FFFCEE 0%,#F1E9D6 60%,#E2D8C0 100%);
  box-shadow:0 5px 0 #C3B89F,0 5px 0 4px #22201C,0 10px 14px rgba(34,32,28,.24);
  color:#2B2823;font-size:22px;letter-spacing:4px;text-shadow:0 1px 0 rgba(255,255,255,.9);}
/* 「重玩」是圆角方（与首页那颗同形制），不是圆 —— 圆钮会与「返回」的胶囊撞形制 */
.btn-replay{background:linear-gradient(180deg,#FFFDF7 0%,#F6EFE0 55%,#E9E0CB 100%);
  box-shadow:0 5px 0 #C3B89F,0 5px 0 4px #22201C,0 10px 14px rgba(34,32,28,.26);
  color:#2B2823;font-size:20px;letter-spacing:1px;text-shadow:0 1px 0 rgba(255,255,255,.9);
  border-radius:22px;}
.btn-replay::before{border-radius:16px;}

.note{font-size:13.5px;color:#8E8571;line-height:1.95;max-width:1200px;margin-top:24px;}
.note b{color:#C4362B;}
table.spec{border-collapse:collapse;font-size:13px;margin-top:14px;}
table.spec th,table.spec td{border:1px solid #DED7C6;padding:6px 12px;text-align:left;}
table.spec th{background:#EFE9DB;font-weight:700;}
table.spec td.n{font-family:ui-monospace,Menlo,monospace;}

body{padding:0;background:#F7F5F0;}
.frame{box-shadow:none;border-radius:0;}
</style></head><body>
