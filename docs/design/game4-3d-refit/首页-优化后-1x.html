<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>首页 · 优化后 1:1</title>
<style>
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:-apple-system,'PingFang SC','Hiragino Sans GB',sans-serif;
  background:#F7F5F0; color:#22201C;
  padding:40px 32px 60px;
  -webkit-font-smoothing:antialiased;
}
h1{font-size:26px; font-weight:800; letter-spacing:1px;}
h1 small{font-size:14px; font-weight:400; color:#8E8571; letter-spacing:0; margin-left:10px;}
.lead{font-size:14px; color:#57503F; line-height:1.9; margin:12px 0 30px; max-width:1180px;}
.lead b{color:#C4362B;}
.row{display:flex; gap:36px; align-items:flex-start; flex-wrap:wrap;}
.col{display:flex; flex-direction:column; align-items:center; gap:14px;}
.cap{font-size:15px; font-weight:700; letter-spacing:.5px;}
.cap em{font-style:normal; font-weight:400; color:#8E8571; font-size:13px;}
.frame{
  width:720px; height:1280px; position:relative; overflow:hidden;
  box-shadow:0 18px 50px rgba(34,32,28,.22); border-radius:4px; flex:none;
  transform-origin:top left;
}
/* 两张稿并排缩到 60% 显示 */
.scale-wrap{width:432px; height:768px; position:relative;}
.scale-wrap .frame{transform:scale(.6);}

/* ---------- 背景贴图层 ---------- */
.frame .bgimg{position:absolute; inset:0; width:100%; height:100%; display:block;}

/* ============================================================
   Q版3D 厚描边控件层（这是要写进代码的样式规格）
   ============================================================ */
.ttl{
  position:absolute; font-family:'Songti SC','STSong','SimSun',serif;
  font-size:38px; font-weight:800; letter-spacing:2px; line-height:1; white-space:nowrap;
  color:#22201C;
  -webkit-text-stroke:4px #F0E4C8;
  paint-order:stroke fill;
  text-shadow:0 5px 0 #C9A227, 0 9px 14px rgba(34,32,28,.30);
}
.ttl-sm{font-size:36px; -webkit-text-stroke:3.5px #F0E4C8; text-shadow:0 4px 0 #C9A227,0 7px 12px rgba(34,32,28,.26);}
.sub{
  position:absolute; font-size:20px; letter-spacing:6px; color:#57503F; font-weight:600;
  text-shadow:0 1px 0 rgba(255,255,255,.85);
}
.gauge-txt{position:absolute; font-size:22px; font-weight:700; color:#57503F; letter-spacing:1px;}
.timer{
  position:absolute; font-size:34px; font-weight:800; color:#C4362B; letter-spacing:1px;
  text-shadow:0 2px 0 rgba(255,255,255,.9), 0 3px 6px rgba(196,54,43,.25);
}
.teach{position:absolute; font-size:15px; color:#57503F; letter-spacing:.3px;}
.qmark{
  position:absolute; width:34px; height:34px; border-radius:50%;
  background:linear-gradient(180deg,#FFFDF7,#EFE6D2);
  border:3px solid #22201C; color:#57503F; font-weight:800; font-size:19px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 0 #C9BFA8, 0 7px 10px rgba(34,32,28,.22);
}
.hint{
  position:absolute; font-size:22px; color:#57503F; letter-spacing:1px;
  text-shadow:0 1px 0 rgba(255,255,255,.85);
}
.ver{position:absolute; font-size:17px; color:#8E8571; letter-spacing:1px;}

/* ---------- 刻度进度条 ---------- */
.gauge{position:absolute; width:420px; height:40px;}
.gauge-track{
  position:absolute; left:0; right:0; top:12px; height:14px;
  background:linear-gradient(180deg,#DFD5BE,#F2EADA);
  border:2.5px solid #22201C; border-radius:99px;
  box-shadow:inset 0 3px 5px rgba(34,32,28,.20), 0 3px 0 #C9BFA8, 0 6px 9px rgba(34,32,28,.20);
}
.gauge-fill{
  position:absolute; left:3px; top:15px; width:104px; height:8px;
  background:linear-gradient(180deg,#E85A4F,#C4362B); border-radius:99px;
}
.gauge-ticks i{position:absolute; top:9px; width:3px; height:20px; background:#B9B09A; border-radius:2px; transform:translateX(-50%);}
.gauge-knob{
  position:absolute; left:100px; top:0; width:26px; height:26px; border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #FFD9A8, #F5C518 55%, #C9A227);
  border:3px solid #22201C; box-shadow:0 4px 0 #A8842A, 0 7px 10px rgba(34,32,28,.28);
}

/* ---------- 大牌（主视觉） ---------- */
.tile-wrap{position:absolute; width:420px; height:520px;}
.tile-shadow{
  position:absolute; left:50%; bottom:96px; width:300px; height:40px; transform:translateX(-50%);
  background:radial-gradient(ellipse, rgba(34,32,28,.28), rgba(34,32,28,0) 70%);
  filter:blur(3px);
}
.tile-plinth{
  position:absolute; left:50%; bottom:34px; width:330px; height:70px; transform:translateX(-50%);
  background:radial-gradient(ellipse, #FBF6EA 0%, #EFE6D2 55%, rgba(239,230,210,0) 78%);
  border-radius:50%;
}
.tile{position:absolute; left:50%; top:44px; transform:translateX(-50%); width:280px; height:400px;}
.tile-face{
  position:absolute; inset:0; border-radius:16px;
  background:linear-gradient(158deg,#FFFFFF 0%,#FBF6EA 52%,#F0E7D4 100%);
  border:4px solid #22201C;
  box-shadow:
    0 12px 0 #CFC4AB,
    0 12px 0 4px #22201C,
    0 22px 30px rgba(34,32,28,.30),
    inset 0 -14px 20px rgba(34,32,28,.07),
    inset 0 8px 0 rgba(255,255,255,.9);
}
.tile-inner{
  position:absolute; inset:16px; border:2px solid rgba(34,32,28,.28); border-radius:8px;
  display:flex; align-items:center; justify-content:center;
}
.pips{display:grid; grid-template-columns:1fr 1fr; gap:26px 34px;}
.pips b{
  width:56px; height:96px; display:block; border-radius:28px;
  background:linear-gradient(180deg,#4E8F63,#2E6B45 55%,#1F5133);
  box-shadow:0 3px 0 #17402A, inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 6px rgba(0,0,0,.22);
}

/* ---------- 按钮 ---------- */
.btn{
  position:absolute; border-radius:999px; border:4px solid #22201C;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; letter-spacing:2px; overflow:hidden;
}
.btn span{position:relative; z-index:2;}
.btn::before{
  content:''; position:absolute; left:5%; right:5%; top:8%; height:36%;
  background:linear-gradient(180deg, rgba(255,255,255,.60), rgba(255,255,255,0));
  border-radius:999px; z-index:1;
}
.btn-main{
  background:linear-gradient(180deg,#EA6055 0%,#D8433A 42%,#C4362B 68%,#A82A21 100%);
  box-shadow:0 9px 0 #7E1D16, 0 9px 0 4px #22201C, 0 20px 26px rgba(34,32,28,.34);
  color:#fff; font-size:42px;
  text-shadow:0 3px 0 rgba(0,0,0,.32);
}
.btn-sub{
  background:linear-gradient(180deg,#FFFDF7 0%,#F6EFE0 55%,#E9E0CB 100%);
  box-shadow:0 8px 0 #C3B89F, 0 8px 0 4px #22201C, 0 16px 22px rgba(34,32,28,.28);
  color:#2B2823; font-size:30px; letter-spacing:4px;
  text-shadow:0 2px 0 rgba(255,255,255,.9);
}
.btn-back{
  background:linear-gradient(180deg,#FFFCEE 0%,#F1E9D6 60%,#E2D8C0 100%);
  box-shadow:0 6px 0 #C3B89F, 0 6px 0 4px #22201C, 0 12px 16px rgba(34,32,28,.26);
  color:#2B2823; font-size:24px; letter-spacing:3px;
  text-shadow:0 1px 0 rgba(255,255,255,.9);
}

/* ---------- 方印 ---------- */
.seal{
  position:absolute; width:78px; height:78px; border-radius:9px;
  background:linear-gradient(160deg,#D8433A,#B02A1E 70%);
  border:3px solid #7E1D16;
  color:#FBF6EA; font-family:'Songti SC','STSong',serif; font-size:44px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 5px 0 #6D1811, 0 10px 14px rgba(34,32,28,.34), inset 0 3px 0 rgba(255,255,255,.22);
  text-shadow:0 2px 3px rgba(0,0,0,.30);
}

/* ---------- 局内：牌堆 ---------- */
.board{position:absolute; left:50%; top:320px; transform:translateX(-50%); width:420px; height:390px;}
.tile-mini{
  position:absolute; width:96px; height:116px; border-radius:11px;
  background:linear-gradient(158deg,#FFFFFF 0%,#FBF6EA 55%,#EFE6D2 100%);
  border:3.5px solid #22201C;
  box-shadow:0 7px 0 #CFC4AB, 0 7px 0 3.5px #22201C, 0 13px 17px rgba(34,32,28,.26),
             inset 0 -8px 12px rgba(34,32,28,.06), inset 0 5px 0 rgba(255,255,255,.9);
  display:flex; align-items:center; justify-content:center;
}
.mw{font-family:'Songti SC','STSong',serif; font-size:44px; font-weight:800; color:#2338A0;
  text-shadow:0 2px 0 rgba(255,255,255,.95);}

/* ---------- 局内：槽位条 ---------- */
.slotbar{
  position:absolute; height:88px; display:flex; gap:6px; padding:7px;
  background:linear-gradient(180deg,#E7DCC4,#F4EDDC);
  border:3.5px solid #22201C; border-radius:14px;
  box-shadow:inset 0 5px 9px rgba(34,32,28,.20), 0 5px 0 #C3B89F, 0 10px 14px rgba(34,32,28,.20);
}
.slotbar i{flex:1; background:linear-gradient(180deg,#DCD2BA,#EFE7D5); border-radius:8px;
  box-shadow:inset 0 3px 6px rgba(34,32,28,.22);}

/* ---------- 局内：道具栏 ---------- */
.tools{position:absolute; height:96px; display:flex; gap:10px;}
.tool{
  flex:1; border-radius:16px; border:3.5px solid #22201C;
  background:linear-gradient(180deg,#FFFDF7 0%,#F2EBD9 60%,#E4DAC2 100%);
  box-shadow:0 7px 0 #C3B89F, 0 7px 0 3.5px #22201C, 0 13px 17px rgba(34,32,28,.24);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:#2B2823;
}
.tool b{font-size:25px; font-weight:800; letter-spacing:1px; text-shadow:0 1px 0 rgba(255,255,255,.9);}
.tool s{font-size:15px; text-decoration:none; color:#8E8571; letter-spacing:.5px;}
.tool-red{
  background:linear-gradient(180deg,#EA6055 0%,#D8433A 45%,#C4362B 100%);
  box-shadow:0 7px 0 #7E1D16, 0 7px 0 3.5px #22201C, 0 13px 17px rgba(34,32,28,.30);
  color:#fff;
}
.tool-red b{text-shadow:0 2px 0 rgba(0,0,0,.30);}
.tool-red s{color:#F6D9D4;}

.note{font-size:13px; color:#8E8571; line-height:1.8; max-width:1180px; margin-top:26px;}
.note b{color:#C4362B;}

body{padding:0; background:#F7F5F0;}
.frame{box-shadow:none; border-radius:0;}
</style></head>
